# top ultrawide (11–16) — Right Ctrl (MOD5) + 1..6, room to grow to 19
bind = MOD5, 1, workspace, 11
bind = MOD5, 2, workspace, 12
bind = MOD5, 3, workspace, 13
bind = MOD5, 4, workspace, 14
bind = MOD5, 5, workspace, 15
bind = MOD5, 6, workspace, 16
bind = MOD5, 7, workspace, 17
bind = MOD5, 8, workspace, 18
bind = MOD5, 9, workspace, 19
bind = MOD5, 0, workspace, 20

bind = MOD5 SHIFT, 1, movetoworkspace, 11
bind = MOD5 SHIFT, 2, movetoworkspace, 12
bind = MOD5 SHIFT, 3, movetoworkspace, 13
bind = MOD5 SHIFT, 4, movetoworkspace, 14
bind = MOD5 SHIFT, 5, movetoworkspace, 15
bind = MOD5 SHIFT, 6, movetoworkspace, 16
bind = MOD5 SHIFT, 7, movetoworkspace, 17
bind = MOD5 SHIFT, 8, movetoworkspace, 18
bind = MOD5 SHIFT, 9, movetoworkspace, 19
bind = MOD5 SHIFT, 0, movetoworkspace, 20

# portretnik 21-30 
bind = $mainMod, DELETE, workspace, 21
bind = $mainMod, HOME, workspace, 22
bind = $mainMod, END, workspace, 23
bind = $mainMod, PAGE_UP, workspace, 24
bind = $mainMod, PAGE_DOWN, workspace, 25

bind = $mainMod SHIFT, DELETE, movetoworkspace, 21
bind = $mainMod SHIFT, HOME, movetoworkspace, 22
bind = $mainMod SHIFT, END, movetoworkspace, 23
bind = $mainMod SHIFT, PAGE_UP, movetoworkspace, 24
bind = $mainMod SHIFT, PAGE_DOWN, movetoworkspace, 25

# focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# tab switching, mac-style (translates to ctrl+pgup/pgdn)
bind = $mainMod ALT, left, sendshortcut, CTRL, Prior, activewindow
bind = $mainMod ALT, right, sendshortcut, CTRL, Next, activewindow

# scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# relative switching (stays on current monitor)
bind = $mainMod, bracketleft, workspace, r-1
bind = $mainMod, bracketright, workspace, r+1
bind = $mainMod SHIFT, bracketleft, movetoworkspace, r-1
bind = $mainMod SHIFT, bracketright, movetoworkspace, r+1

# mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
                           
