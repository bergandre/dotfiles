bind = $mainMod, T, pin, active
bind = $mainMod, C, sendshortcut, CTRL, C
bind = $mainMod, V, sendshortcut, CTRL, V
bind = $mainMod, X, sendshortcut, CTRL, X
bind = $mainMod, A, sendshortcut, CTRL, A
bind = $mainMod, Z, sendshortcut, CTRL, Z
bind = $mainMod, S, sendshortcut, CTRL, S
bind = $mainMod, F, sendshortcut, CTRL, F
bind = $mainMod CTRL, S, exec, grimblast copy area
bind = $mainMod SHIFT, F, fullscreenstate, 0 2
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, F, exec, $notifycmd 'Fullscreen Mode' $mainMod
bind = $mainMod, R, exec, $menu
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, $fileManager
                           
#       _       _           
# _ _ _|_|___ _| |___ _ _ _ 
#| | | | |   | . | . | | | |
#|_____|_|_|_|___|___|_____|

bind = $mainMod ALT, Space, togglefloating
bind = $mainMod, Space, centerwindow
bind = $mainMod, C, exec, wl-copy
bind = $mainMod, V, exec, wl-paste
bind = $mainMod, X, exec, wl-copy --cut
bind = $mainMod, A, exec, wtype -M ctrl a

binde = $mainMod ALT, h, resizeactive, -20 0
binde = $mainMod ALT, l, resizeactive, 20 0
binde = $mainMod ALT, k, resizeactive, 0 -20
binde = $mainMod ALT, j, resizeactive, 0 20

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# _____ ___ _| |_|___ 
#|     | -_| . | | .'|
#|_|_|_|___|___|_|__,|

# spotify
bind = CTRL,DELETE,exec,dbus-send --print-reply --dest=org.mpris.MediaPlayer2.spotify /org/mpris/MediaPlayer2 org.mpris.MediaPlayer2.Player.Next
bind = CTRL,HOME,exec,dbus-send --print-reply --dest=org.mpris.MediaPlayer2.spotify /org/mpris/MediaPlayer2 org.mpris.MediaPlayer2.Player.Previous
bind = CTRL,SPACE, exec, dbus-send --print-reply --dest=org.mpris.MediaPlayer2.spotify /org/mpris/MediaPlayer2 org.mpris.MediaPlayer2.Player.PlayPause


