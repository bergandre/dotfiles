# Route apps: podcasts -> EasyEffects (LoudnessEqualizer), music -> "Music" sink (pipewire.conf.d/music-sink.conf).
# Everything else goes to the default device untouched (EasyEffects processAllOutputs=false).
pulse.rules = [
    {
        matches = [ { application.process.binary = "chromium" } { application.process.binary = "freetube" } ]
        actions = { update-props = { target.object = "easyeffects_sink" } }
    }
    {
        matches = [ { application.process.binary = "spotify" } ]
        actions = { update-props = { target.object = "music_sink" } }
    }
]
