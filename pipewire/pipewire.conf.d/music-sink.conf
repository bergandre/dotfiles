# Virtual "Music" sink for spotify/soundcloud (routing: pipewire-pulse.conf.d + client.conf.d app-routing.conf).
# Chain: -8 dB preamp -> AutoEQ Arctis Nova Pro Wireless (wired, oratory1990) -> Perfect EQ
#        -> Calf Bass Enhancer -> LSP limiter at -1 dB.  Generated, per channel L/R.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Music"
            media.name       = "Music"
            filter.graph = {
                nodes = [
                    { type = builtin name = preL label = mixer control = { "Gain 1" = 0.398 } }
                    { type = builtin name = eqL0 label = bq_lowshelf control = { "Freq" = 105 "Q" = 0.7 "Gain" = -4.1 } }
                    { type = builtin name = eqL1 label = bq_peaking control = { "Freq" = 134 "Q" = 0.9 "Gain" = -5.8 } }
                    { type = builtin name = eqL2 label = bq_peaking control = { "Freq" = 56 "Q" = 1.5 "Gain" = 4.4 } }
                    { type = builtin name = eqL3 label = bq_peaking control = { "Freq" = 3993 "Q" = 3.24 "Gain" = 5.8 } }
                    { type = builtin name = eqL4 label = bq_peaking control = { "Freq" = 341 "Q" = 2.32 "Gain" = 2.6 } }
                    { type = builtin name = eqL5 label = bq_highshelf control = { "Freq" = 10000 "Q" = 0.7 "Gain" = -1.9 } }
                    { type = builtin name = eqL6 label = bq_peaking control = { "Freq" = 6469 "Q" = 5.11 "Gain" = 3.7 } }
                    { type = builtin name = eqL7 label = bq_peaking control = { "Freq" = 9152 "Q" = 2.58 "Gain" = 2.7 } }
                    { type = builtin name = eqL8 label = bq_peaking control = { "Freq" = 1532 "Q" = 2.79 "Gain" = 2.0 } }
                    { type = builtin name = eqL9 label = bq_peaking control = { "Freq" = 824 "Q" = 1.88 "Gain" = -1.4 } }
                    { type = builtin name = eqL10 label = bq_peaking control = { "Freq" = 32 "Q" = 1.5 "Gain" = 4 } }
                    { type = builtin name = eqL11 label = bq_peaking control = { "Freq" = 64 "Q" = 1.5 "Gain" = 2 } }
                    { type = builtin name = eqL12 label = bq_peaking control = { "Freq" = 125 "Q" = 1.5 "Gain" = 1 } }
                    { type = builtin name = eqL13 label = bq_peaking control = { "Freq" = 500 "Q" = 1.5 "Gain" = -1 } }
                    { type = builtin name = eqL14 label = bq_peaking control = { "Freq" = 1000 "Q" = 1.5 "Gain" = -2 } }
                    { type = builtin name = eqL15 label = bq_peaking control = { "Freq" = 4000 "Q" = 1.5 "Gain" = 2 } }
                    { type = builtin name = eqL16 label = bq_peaking control = { "Freq" = 8000 "Q" = 1.5 "Gain" = 3 } }
                    { type = builtin name = eqL17 label = bq_peaking control = { "Freq" = 16000 "Q" = 1.5 "Gain" = 3 } }
                    { type = builtin name = preR label = mixer control = { "Gain 1" = 0.398 } }
                    { type = builtin name = eqR0 label = bq_lowshelf control = { "Freq" = 105 "Q" = 0.7 "Gain" = -4.1 } }
                    { type = builtin name = eqR1 label = bq_peaking control = { "Freq" = 134 "Q" = 0.9 "Gain" = -5.8 } }
                    { type = builtin name = eqR2 label = bq_peaking control = { "Freq" = 56 "Q" = 1.5 "Gain" = 4.4 } }
                    { type = builtin name = eqR3 label = bq_peaking control = { "Freq" = 3993 "Q" = 3.24 "Gain" = 5.8 } }
                    { type = builtin name = eqR4 label = bq_peaking control = { "Freq" = 341 "Q" = 2.32 "Gain" = 2.6 } }
                    { type = builtin name = eqR5 label = bq_highshelf control = { "Freq" = 10000 "Q" = 0.7 "Gain" = -1.9 } }
                    { type = builtin name = eqR6 label = bq_peaking control = { "Freq" = 6469 "Q" = 5.11 "Gain" = 3.7 } }
                    { type = builtin name = eqR7 label = bq_peaking control = { "Freq" = 9152 "Q" = 2.58 "Gain" = 2.7 } }
                    { type = builtin name = eqR8 label = bq_peaking control = { "Freq" = 1532 "Q" = 2.79 "Gain" = 2.0 } }
                    { type = builtin name = eqR9 label = bq_peaking control = { "Freq" = 824 "Q" = 1.88 "Gain" = -1.4 } }
                    { type = builtin name = eqR10 label = bq_peaking control = { "Freq" = 32 "Q" = 1.5 "Gain" = 4 } }
                    { type = builtin name = eqR11 label = bq_peaking control = { "Freq" = 64 "Q" = 1.5 "Gain" = 2 } }
                    { type = builtin name = eqR12 label = bq_peaking control = { "Freq" = 125 "Q" = 1.5 "Gain" = 1 } }
                    { type = builtin name = eqR13 label = bq_peaking control = { "Freq" = 500 "Q" = 1.5 "Gain" = -1 } }
                    { type = builtin name = eqR14 label = bq_peaking control = { "Freq" = 1000 "Q" = 1.5 "Gain" = -2 } }
                    { type = builtin name = eqR15 label = bq_peaking control = { "Freq" = 4000 "Q" = 1.5 "Gain" = 2 } }
                    { type = builtin name = eqR16 label = bq_peaking control = { "Freq" = 8000 "Q" = 1.5 "Gain" = 3 } }
                    { type = builtin name = eqR17 label = bq_peaking control = { "Freq" = 16000 "Q" = 1.5 "Gain" = 3 } }
                    { type = lv2 name = bass plugin = "http://calf.sourceforge.net/plugins/BassEnhancer"
                      control = { "amount" = 2.0 "drive" = 8.5 "blend" = 0.0 "freq" = 120.0 "floor_active" = 1 "floor" = 20.0 } }
                    { type = lv2 name = lim plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                      control = { "alr" = 0 "th" = 0.891 "lk" = 5.0 "at" = 5.0 "rt" = 20.0 "boost" = 0 } }
                ]
                links = [
                    { output = "preL:Out" input = "eqL0:In" }
                    { output = "eqL0:Out" input = "eqL1:In" }
                    { output = "eqL1:Out" input = "eqL2:In" }
                    { output = "eqL2:Out" input = "eqL3:In" }
                    { output = "eqL3:Out" input = "eqL4:In" }
                    { output = "eqL4:Out" input = "eqL5:In" }
                    { output = "eqL5:Out" input = "eqL6:In" }
                    { output = "eqL6:Out" input = "eqL7:In" }
                    { output = "eqL7:Out" input = "eqL8:In" }
                    { output = "eqL8:Out" input = "eqL9:In" }
                    { output = "eqL9:Out" input = "eqL10:In" }
                    { output = "eqL10:Out" input = "eqL11:In" }
                    { output = "eqL11:Out" input = "eqL12:In" }
                    { output = "eqL12:Out" input = "eqL13:In" }
                    { output = "eqL13:Out" input = "eqL14:In" }
                    { output = "eqL14:Out" input = "eqL15:In" }
                    { output = "eqL15:Out" input = "eqL16:In" }
                    { output = "eqL16:Out" input = "eqL17:In" }
                    { output = "eqL17:Out" input = "bass:in_l" }
                    { output = "preR:Out" input = "eqR0:In" }
                    { output = "eqR0:Out" input = "eqR1:In" }
                    { output = "eqR1:Out" input = "eqR2:In" }
                    { output = "eqR2:Out" input = "eqR3:In" }
                    { output = "eqR3:Out" input = "eqR4:In" }
                    { output = "eqR4:Out" input = "eqR5:In" }
                    { output = "eqR5:Out" input = "eqR6:In" }
                    { output = "eqR6:Out" input = "eqR7:In" }
                    { output = "eqR7:Out" input = "eqR8:In" }
                    { output = "eqR8:Out" input = "eqR9:In" }
                    { output = "eqR9:Out" input = "eqR10:In" }
                    { output = "eqR10:Out" input = "eqR11:In" }
                    { output = "eqR11:Out" input = "eqR12:In" }
                    { output = "eqR12:Out" input = "eqR13:In" }
                    { output = "eqR13:Out" input = "eqR14:In" }
                    { output = "eqR14:Out" input = "eqR15:In" }
                    { output = "eqR15:Out" input = "eqR16:In" }
                    { output = "eqR16:Out" input = "eqR17:In" }
                    { output = "eqR17:Out" input = "bass:in_r" }
                    { output = "bass:out_l" input = "lim:in_l" }
                    { output = "bass:out_r" input = "lim:in_r" }
                ]
                inputs  = [ "preL:In 1" "preR:In 1" ]
                outputs = [ "lim:out_l" "lim:out_r" ]
            }
            capture.props = {
                node.name      = "music_sink"
                media.class    = Audio/Sink
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name      = "music_out"
                node.passive   = true
                audio.position = [ FL FR ]
            }
        }
    }
]
