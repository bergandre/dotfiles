# Virtual "Podcast" sink: compressor + limiter for loud talkers (chromium is routed here).
# LSP gains are linear: 0.063 = -24 dB, 0.501 = -6 dB, 1.585 = +4 dB, 0.708 = -3 dB.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Podcast"
            media.name       = "Podcast"
            filter.graph = {
                nodes = [
                    { type = lv2 name = comp plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
                      control = { "cm" = 0 "scm" = 1 "al" = 0.063 "cr" = 4.0 "kn" = 0.501
                                  "at" = 10.0 "rt" = 250.0 "mk" = 1.585 } }
                    { type = lv2 name = lim plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                      control = { "alr" = 0 "th" = 0.708 "lk" = 5.0 "at" = 5.0 "rt" = 20.0 "boost" = 0 } }
                ]
                links = [
                    { output = "comp:out_l" input = "lim:in_l" }
                    { output = "comp:out_r" input = "lim:in_r" }
                ]
                inputs  = [ "comp:in_l" "comp:in_r" ]
                outputs = [ "lim:out_l" "lim:out_r" ]
            }
            capture.props = {
                node.name      = "podcast_sink"
                media.class    = Audio/Sink
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name      = "podcast_out"
                node.passive   = true
                audio.position = [ FL FR ]
            }
        }
    }
]
