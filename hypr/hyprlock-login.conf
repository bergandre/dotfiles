# boot lock (tty1 autologin): fixed picture per monitor, idle lock stays hyprlock.conf
# pictures live in the wallpapers repo, cropped to each monitor's size
background {
    monitor = DP-1
    path = /home/supernova/repositories/wallpapers/lockscreen/DP-1.jpg
}

background {
    monitor = DP-2
    path = /home/supernova/repositories/wallpapers/lockscreen/DP-2.jpg
}

background {
    monitor = DP-3
    path = /home/supernova/repositories/wallpapers/lockscreen/DP-3.jpg
}

background {
    monitor = HDMI-A-1
    color = rgba(25, 20, 20, 1.0)
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(15, 15, 15)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

# dark text, the pictures are white
# one label per monitor: an empty monitor would also draw on DP-1
label {
    monitor = DP-2
    text = $TIME
    color = rgb(15, 15, 15)
    font_size = 50
    font_family = Sans
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor = DP-3
    text = $TIME
    color = rgb(15, 15, 15)
    font_size = 50
    font_family = Sans
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor = HDMI-A-1
    text = $TIME
    font_size = 50
    font_family = Sans
    position = 0, 80
    halign = center
    valign = center
}

# portrait: above her head, the hair starts ~230px from the top
label {
    monitor = DP-1
    text = $TIME
    color = rgb(15, 15, 15)
    font_size = 50
    font_family = Sans
    position = 0, -60
    halign = center
    valign = top
}
