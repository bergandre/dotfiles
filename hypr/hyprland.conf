}

monitorv2 {
    output = $side_monitor
    mode = 2560x1440@75
    position = 3440x-720
    scale = 1
transform = 3
    vrr = 3
    bitdepth = 10
    cm = hdr
    sdrbrightness = 1.0
    sdrsaturation = 1.1
}

monitorv2 {
    output = $tv
    mode = 3840x2160@120
    position = 4880x-720
    scale = 1
    bitdepth = 10
    cm = hdr
    sdrbrightness = 1.3
    sdrsaturation = 1.3
}

