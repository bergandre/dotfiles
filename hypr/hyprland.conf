#### DP-2 - Bottom Ultrawide
# 1 - main
# 2 - big terminal with splits
# 3 - gaming
windowrule = workspace 3 silent, match:class steam
windowrule = workspace 3 silent, match:class com.usebottles.bottles
windowrule = workspace 3 silent, match:class WowUpCf
windowrule = workspace 3 silent, match:class shf-win64-shipping.exe
windowrule = workspace 3, match:class battle.net.exe
windowrule = workspace 4, match:class steam_proton 

#### DP-3 - Top Ultrawide

#### HDMI-n - Side Portrait
# 21 - main, tipo v brauzere sizhu na side
# 22 - Device connection and switching 
windowrule = workspace 22 silent, match:class blueman.* 
windowrule = workspace 22 silent, match:class org.pulseaudio.pavucontrol
# 23 - music and EQ
windowrule = workspace 23 silent, match:class Spotify
windowrule = workspace 23 silent, match:class com.github.wwmm.easyeffects
# 24 - social
windowrule = workspace 24 silent, match:class Beeper
windowrule = workspace 24 silent, match:class vesktop
# 25 - srs business lmao
windowrule = workspace 25 silent, match:class org.mozilla.Thunderbird
windowrule = workspace 25 silent, match:class ticktick 

###### Dump stuff I rarely use or has problems with floating
windowrule = workspace 27 silent, match:title ^(ALVR)(.*
windowrule = workspace 27 silent, match:class Immersed

#### Scratchpad
#windowrule = workspace special:magic silent, match:class obsidian
windowrule = workspace special:magic silent, match:class Beeper
windowrule = workspace special:magic silent, match:class vesktop 

